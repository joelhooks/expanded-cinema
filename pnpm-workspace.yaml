packages:
  - "apps/*"
  - "packages/*"
  - "archives/*"

allowBuilds:
  lefthook: true
  esbuild: true
  '@parcel/watcher': true
  msgpackr-extract: true
  workerd: true

# One Effect major across the workspace: v4 stable, pinned exactly.
# Keep the platform packages on the same stable release as Effect.
overrides:
  "@effect/platform-node-shared": 4.0.2
  "@effect/platform-bun": 4.0.2
  "@effect/platform-node": 4.0.2
  "@effect/sql-d1": 4.0.2
  "@effect/sql-sqlite-do": 4.0.2
  "@effect/vitest": 4.0.2
  effect: 4.0.2
  alchemy: 2.0.0-beta.77
